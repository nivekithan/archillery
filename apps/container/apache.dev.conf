Listen 3000
ServerName localhost

<VirtualHost *:3000>
    DocumentRoot /var/www/html

    SetEnv GIT_PROJECT_ROOT /var/lib/git
    SetEnv GIT_HTTP_EXPORT_ALL

    <Location />
        AuthType Basic
        AuthName "Git gateway"
        AuthUserFile /etc/apache2/origin.htpasswd
        Require valid-user
    </Location>

    ProxyPass /api/v1/ http://git-metadata-service:3001/api/v1/
    ProxyPassReverse /api/v1/ http://git-metadata-service:3001/api/v1/

    RewriteEngine On
    RewriteRule ^/git/ - [L]
    RewriteRule ^/([^/]+)/([^/]+)\.git/?$ /$1/$2/ [R=302,L]
    RewriteCond %{QUERY_STRING} (^|&)service=git-(upload|receive)-pack(&|$)
    RewriteRule ^/[^/]+/[^/]+/info/refs$ /git/repository.git/info/refs [PT,L]
    RewriteRule ^/[^/]+/[^/]+/git-(upload|receive)-pack$ /git/repository.git/git-$1-pack [PT,L]

    ScriptAlias /git/ /usr/lib/git-core/git-http-backend/

    <Directory /usr/lib/git-core>
        Options +ExecCGI -MultiViews
        Require all granted
    </Directory>

    <Directory /var/www/html>
        Require all granted
    </Directory>

    ErrorLog /var/log/apache2/error.log
    CustomLog /var/log/apache2/access.log combined
</VirtualHost>
